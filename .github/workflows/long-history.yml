name: Recopilar histórico real 2020-2026
on:
  pull_request:
    paths: ['evaluation/download_long_history.py', 'evaluation/test_download_long_history.py', '.github/workflows/long-history.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {symbol: ADAUSDT, interval: 1h}
          - {symbol: ADAUSDT, interval: 4h}
          - {symbol: ADAUSDT, interval: 1d}
          - {symbol: ADAUSDT, interval: 5m}
          - {symbol: BTCUSDT, interval: 4h}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar integridad, límites y huecos
        run: python3 -m unittest discover -s evaluation -p 'test_download_long_history.py'
      - name: Descargar y verificar archivos oficiales
        run: python3 evaluation/download_long_history.py --symbol '${{ matrix.symbol }}' --interval '${{ matrix.interval }}' --output evaluation/long-history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historico-${{ matrix.symbol }}-${{ matrix.interval }}
          path: evaluation/long-history/
          retention-days: 90
