name: Android - compilacion y pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar Android 3.8.0
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar y ejecutar pruebas unitarias
        run: bash ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-unitarias
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar APK de prueba
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-criptoanalisis-multi
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
