name: Validación prospectiva de 15 combinaciones
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'evaluation/selected_validation*'
      - 'evaluation/prepare_selected_models.py'
      - 'evaluation/fetch_selected_data.py'
      - 'evaluation/test_selected_validation.py'
      - 'app/src/test/java/com/domingales/criptoanalisis/multi/evaluation/SelectedProspectiveTest.kt'
      - '.github/workflows/selected-validation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: selected-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r evaluation/requirements-replay.txt
      - run: python3 -m unittest discover -s evaluation -p 'test_*.py'
      - name: Lista de combinaciones registrada
        id: pairs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('evaluation/selected_validation_protocol.json'))
          print('pairs='+','.join(s+':'+t for s,t in p['selections']))
          PY
      - name: Recuperar modelos congelados propios sin sustituir los ya guardados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          p=json.load(open('evaluation/selected_validation_protocol.json'))
          for s,t in p['selections']:
              folder=pathlib.Path('evaluation/selected-prospective/models')/(s+'-'+t)
              if (folder/'model_manifest.json').exists(): continue
              name='prospective-frozen-'+s+'-'+t
              response=subprocess.check_output(['gh','api','repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/actions/artifacts?name='+name+'&per_page=10'])
              artifacts=json.loads(response)['artifacts']
              if artifacts:
                  a=next((a for a in artifacts if not a['expired']),None)
                  if a:
                      subprocess.run(['gh','run','download',str(a['workflow_run']['id']),'--name',name,'--dir',str(folder)],check=True)
          PY
      - run: python3 evaluation/fetch_selected_data.py --output selected-data
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 evaluation/prepare_expanded_adapter.py
      - name: Registrar sólo las últimas velas conocidas
        run: bash ./gradlew --no-daemon testDebugUnitTest --tests com.domingales.criptoanalisis.multi.evaluation.SelectedProspectiveTest
        env:
          SELECTED_PAIRS: ${{ steps.pairs.outputs.pairs }}
          SELECTED_DATA_DIR: ${{ github.workspace }}/selected-data
          SELECTED_OUTPUT_DIR: ${{ github.workspace }}/selected-output
          JAVA_TOOL_OPTIONS: '-Xmx4g'
      - name: Guardar pronósticos antes de resolver sus ventanas futuras
        run: |
          engine_sha=$(sha256sum app/src/main/java/com/domingales/criptoanalisis/multi/domain/*.kt | sha256sum | cut -d' ' -f1)
          python3 evaluation/selected_validation.py --root evaluation/selected-prospective --data selected-data --decisions selected-output/decisions.tsv --models evaluation/selected-prospective/models --version "$GITHUB_SHA" --engine-sha256 "$engine_sha"
      - name: Persistir la cohorte nueva sin sobrescribir otros cambios
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "CriptoAnalisis evaluator"
          git config user.email "evaluator@users.noreply.github.com"
          git add evaluation/selected-prospective/
          if ! git diff --cached --quiet; then
            git commit -m "Registrar validación prospectiva congelada de combinaciones seleccionadas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-prospective-${{ github.run_id }}
          path: |
            selected-output/
            selected-data/manifest.json
            evaluation/selected-prospective/
            app/build/test-results/testDebugUnitTest/
          retention-days: 90
