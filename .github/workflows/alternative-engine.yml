name: Motor alternativo experimental
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r evaluation/requirements-alternative.txt
      - run: python3 -m unittest discover -s evaluation -p 'test_alternative_engine.py'
      - run: python3 -m zipfile -e evaluation/reference_501819f.zip evaluation/reference
      - run: python3 evaluation/alternative_engine.py --data evaluation/reference/data --cases evaluation/reference/output/ada_1h_casos.csv --output evaluation/alternative-output/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: motor-alternativo-experimental
          path: evaluation/alternative-output/
          retention-days: 90
