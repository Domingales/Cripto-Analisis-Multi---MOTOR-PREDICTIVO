name: Comprobar recogida real con criterio de magnitud y plazo
on:
  push:
    branches: [research/expanded-replay-150]
    paths: ['.github/workflows/magnitude-live-check.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: research-prospective-durable-writes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/expanded-replay-150
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r evaluation/requirements-replay.txt
      - run: python3 -m unittest discover -s evaluation -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Recoger decisiones nuevas y evaluarlas con Kotlin Android
        run: bash evaluation/run_selected_collection.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magnitude-live-${{ github.run_id }}
          path: |
            evaluation/selected-prospective/
            magnitude-selected-work/
            selected-data/manifest.json
            selected-output/
            app/build/test-results/testDebugUnitTest/
          retention-days: 90
