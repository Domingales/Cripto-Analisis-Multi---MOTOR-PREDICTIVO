name: Filtro estricto desde29octubre2023 sin futuro
on:
  push:
    branches: [research/expanded-replay-150]
    paths:
      - 'evaluation/strict_abstention.py'
      - 'evaluation/test_strict_abstention.py'
      - '.github/workflows/strict-abstention.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r evaluation/requirements-replay.txt
      - run: python3 -m unittest discover -s evaluation -p 'test_*.py'
      - name: Recuperar decisiones y etiquetas Kotlin archivadas verificadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12768818184/zip" > magnitude-source.zip
          python3 -c "from pathlib import Path;import hashlib;assert hashlib.sha256(Path('magnitude-source.zip').read_bytes()).hexdigest()=='4738051e6fd0538d1c45b3c0a409c55d03f9c62ff3ffd355a7540bfc303e0184'"
          unzip -q magnitude-source.zip 'magnitude-output/features.jsonl' 'magnitude-output/labels.tsv' 'magnitude-output/prelabel-manifest.json' 'replay-kotlin/kotlin_accepted.csv' 'replay-kotlin/kotlin_decisions.csv' 'replay-data/*manifest.json' -d source
      - name: Congelar con datos anteriores y predecir antes de resolver examen
        run: python3 evaluation/strict_abstention.py --source source --output strict-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 evaluation/prepare_expanded_adapter.py
      - run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-abstention-${{ github.run_id }}
          path: |
            strict-output/
            source/replay-data/*manifest.json
            app/build/test-results/testDebugUnitTest/
          retention-days: 90
