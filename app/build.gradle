plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// El proyecto sigue compilando sin credenciales. El plugin se activa únicamente
// cuando el usuario añade app/google-services.json desde su Firebase Spark.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.domingales.criptoanalisis.multi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.domingales.criptoanalisis.multi'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '3.8.0-resultados-predictivos-v2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
}
